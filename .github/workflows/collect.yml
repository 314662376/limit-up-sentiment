name: collect-sentiment

# 每个交易日收盘后抓一次「全天完整分时」写入 data/，供 5 日图与存档兜底使用。
#
# 为什么改成「收盘后一次抓全天」而不是「盘中逐分钟轮询」：
#   同花顺的 v6/time 分时接口在盘后仍会返回当日完整的 241 个点，所以只要在收盘后成功跑一次，
#   全天数据就齐了。这比依赖 9 轮 × 14 分钟的轮询可靠得多 —— 之前那版实测 cron 一次都没触发
#   （GitHub 的 scheduled workflow 对新仓库 / 低活跃仓库经常丢调度），当天只存到上午半天。
#   页面本身盘中、盘后都直连分时接口现算，不依赖这里的存档。
#
# cron 用 UTC；北京时间 = UTC+8，中国无夏令时。
on:
  schedule:
    - cron: '10 7 * * 1-5'    # 北京 15:10（收盘后 10 分钟）
    - cron: '40 7 * * 1-5'    # 北京 15:40（冗余重跑，同日幂等）
    - cron: '10 8 * * 1-5'    # 北京 16:10（再兜一次）
  workflow_dispatch:
    inputs:
      probe:
        description: '仅做连通性探测（只读不写），用于确认同花顺接口对 GitHub 出口 IP 是否放行'
        type: boolean
        default: false

permissions:
  contents: write             # 允许把 data/ 提交回仓库

concurrency:
  group: collect-sentiment
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 配置 git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 连通性探测（手动触发专用）
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.probe == 'true' }}
        run: node scripts/collect.js --probe

      - name: 抓取当日完整分时并提交
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.probe == 'true') }}
        run: |
          set -u
          echo "北京时间 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"

          node scripts/collect.js --full

          git add data/ || true
          if git diff --staged --quiet; then
            echo "  无数据变化（同日重跑幂等）"
            exit 0
          fi
          git commit -m "data: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M') 全天分时" || true
          if git push origin HEAD:main; then exit 0; fi
          echo "  push 被拒，尝试 rebase 后重试"
          git rebase --abort 2>/dev/null || true
          if ! git pull --rebase --autostash origin main; then
            git rebase --abort 2>/dev/null || true
            echo "  !! rebase 冲突，本轮放弃"
            exit 0
          fi
          git push origin HEAD:main || echo "  !! push 仍失败"
